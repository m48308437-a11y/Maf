<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MFA | ورود و ثبت‌نام</title>

<style>
body{
    margin:0;
    font-family:tahoma;
    background:#111827;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:350px;
    background:#1f2937;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px #000;
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:none;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2563eb;
    color:white;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#msg{
    text-align:center;
    margin-top:15px;
}
</style>

</head>

<body>

<div class="box">

<h2>ورود / ثبت‌نام MFA</h2>

<input id="username" placeholder="نام کاربری">

<input id="password" 
type="password"
placeholder="رمز عبور (حداقل ۶ کاراکتر)">


<button onclick="register()">
ثبت‌نام
</button>


<button onclick="login()">
ورود
</button>


<div id="msg"></div>

</div>


<script>

const msg = document.getElementById("msg");


function show(text,color="white"){
    msg.style.color=color;
    msg.innerHTML=text;
}



async function register(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value;


let res =
await fetch("/api/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username,
password
})

});


let data =
await res.json();


if(data.success){

show(
"ثبت‌نام موفق بود، حالا وارد شوید",
"lightgreen"
);

}else{

show(data.error,"red");

}

}





async function login(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value;


let res =
await fetch("/api/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username,
password
})

});


let data =
await res.json();


if(data.success){

localStorage.setItem(
"token",
data.token
);


localStorage.setItem(
"user",
JSON.stringify(data.user)
);


show(
"ورود موفق ✅",
"lightgreen"
);


setTimeout(()=>{

window.location.href="index.html";

},1000);



}else{

show(data.error,"red");

}


}


</script>


</body>
</html>

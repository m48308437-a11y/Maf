<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جستجو | MFA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#FFFBFC;
      --bg-alt:#FDF2F7;
      --card:#FFFFFF;
      --ink:#2A1220;
      --ink-soft:#7A5A69;
      --ink-faint:#B98FA3;
      --accent:#E893B3;
      --accent-deep:#C15C86;
      --accent-line:#F0D2DF;
      --gold:#C9932F;
      --shadow:0 18px 40px -22px rgba(193,92,134,.35);
      --maxw:1240px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:'Vazirmatn',sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button,
    input,
    select{
      font-family:inherit;
    }

    .wrap{
      max-width:var(--maxw);
      margin:0 auto;
      padding:0 28px;
    }

    /* NAVBAR */

    .navbar{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(255,251,252,.92);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--accent-line);
    }

    .nav-inner{
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .logo{
      font-weight:800;
      font-size:1.4rem;
      display:flex;
      align-items:baseline;
      gap:6px;
      white-space:nowrap;
    }

    .logo .mark{
      color:var(--accent-deep);
      font-family:Georgia,serif;
      font-style:italic;
    }

    .nav-links{
      display:flex;
      gap:30px;
      color:var(--ink-soft);
      font-size:.92rem;
      font-weight:500;
    }

    .nav-links a{
      position:relative;
      padding:6px 0;
    }

    .nav-links a:hover,
    .nav-links a.active{
      color:var(--accent-deep);
    }

    .nav-links a.active{
      font-weight:800;
    }

    .nav-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid var(--accent-line);
      background:var(--card);
    }

    .btn{
      border:none;
      cursor:pointer;
      border-radius:999px;
      padding:10px 20px;
      font-size:.86rem;
      font-weight:700;
    }

    .btn-primary{
      background:var(--ink);
      color:#fff;
    }

    /* SEARCH HEADER */

    .search-hero{
      padding:44px 0 34px;
      background:var(--bg-alt);
      border-bottom:1px solid var(--accent-line);
    }

    .search-hero h1{
      margin:0 0 18px;
      font-size:1.55rem;
    }

    .search-box{
      position:relative;
      max-width:720px;
    }

    .search-box input{
      width:100%;
      border:1.5px solid var(--accent-line);
      border-radius:14px;
      background:#fff;
      color:var(--ink);
      padding:16px 52px 16px 20px;
      font-size:.95rem;
      outline:none;
    }

    .search-box input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(232,147,179,.12);
    }

    .search-icon{
      position:absolute;
      right:18px;
      top:50%;
      transform:translateY(-50%);
      color:var(--ink-faint);
      font-size:1.1rem;
    }

    .suggest-panel{
      display:none;
      position:absolute;
      left:0;
      right:0;
      top:58px;
      z-index:30;
      background:#fff;
      border:1px solid var(--accent-line);
      border-radius:14px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .suggest-panel.show{
      display:block;
    }

    .suggest-row{
      display:flex;
      align-items:center;
      gap:12px;
      padding:11px 15px;
      cursor:pointer;
      transition:.15s;
    }

    .suggest-row:hover{
      background:var(--bg-alt);
    }

    .suggest-thumb{
      width:38px;
      height:38px;
      flex:0 0 38px;
      border-radius:8px;
      background:linear-gradient(160deg,#F7D8E4,#D97BA2);
      background-size:cover;
      background-position:center;
    }

    .suggest-title{
      font-size:.84rem;
      font-weight:700;
    }

    .suggest-title small{
      display:block;
      margin-top:2px;
      color:var(--ink-faint);
      font-size:.7rem;
      font-weight:400;
    }

    /* LAYOUT */

    .layout{
      display:grid;
      grid-template-columns:260px 1fr;
      gap:32px;
      padding:36px 0 60px;
      align-items:start;
    }

    /* FILTERS */

    .filters{
      background:#fff;
      border:1px solid var(--accent-line);
      border-radius:16px;
      padding:22px;
      position:sticky;
      top:96px;
    }

    .filters h3{
      margin:0 0 20px;
      font-size:.98rem;
    }

    .filter-group{
      margin-bottom:22px;
    }

    .filter-group:last-child{
      margin-bottom:0;
    }

    .filter-group h4{
      margin:0 0 10px;
      color:var(--ink-soft);
      font-size:.77rem;
      font-weight:800;
    }

    .chip-set{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .chip{
      padding:7px 13px;
      border-radius:999px;
      border:1px solid var(--accent-line);
      color:var(--ink-soft);
      font-size:.77rem;
      font-weight:600;
      cursor:pointer;
      transition:.15s;
    }

    .chip:hover{
      border-color:var(--accent-deep);
    }

    .chip.on{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
    }

    .range-row{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .range-row input{
      flex:1;
      accent-color:var(--accent-deep);
    }

    .range-val{
      min-width:45px;
      text-align:left;
      color:var(--ink-soft);
      font-size:.77rem;
    }

    .radio-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .radio-row{
      display:flex;
      align-items:center;
      gap:7px;
      cursor:pointer;
      color:var(--ink-soft);
      font-size:.81rem;
    }

    .radio-row input{
      accent-color:var(--accent-deep);
    }

    .clear-filters{
      width:100%;
      margin-top:20px;
      padding:9px;
      background:transparent;
      border:1px solid var(--accent-line);
      border-radius:10px;
      color:var(--ink-faint);
      cursor:pointer;
      font-size:.78rem;
    }

    /* RESULTS */

    .results-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:15px;
    }

    .results-count{
      color:var(--ink-soft);
      font-size:.85rem;
    }

    .results-count b{
      color:var(--ink);
    }

    .sort-select{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--ink-soft);
      font-size:.8rem;
    }

    .sort-select select{
      padding:8px 12px;
      border:1px solid var(--accent-line);
      background:#fff;
      border-radius:10px;
      color:var(--ink);
      outline:none;
    }

    .active-filters{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:18px;
    }

    .active-chip{
      display:flex;
      align-items:center;
      gap:6px;
      background:var(--bg-alt);
      color:var(--accent-deep);
      border:1px solid var(--accent-line);
      border-radius:999px;
      padding:5px 7px 5px 11px;
      font-size:.74rem;
      font-weight:700;
    }

    .active-chip .x{
      width:17px;
      height:17px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--accent-deep);
      color:#fff;
      cursor:pointer;
      font-size:.58rem;
    }

    .result-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
    }

    .result-card{
      background:#fff;
      border:1px solid var(--accent-line);
      border-radius:16px;
      overflow:hidden;
      transition:.25s;
    }

    .result-card:hover{
      transform:translateY(-5px);
      box-shadow:var(--shadow);
    }

    .result-poster{
      height:215px;
      position:relative;
      background-size:cover;
      background-position:center;
    }

    .result-poster.fallback1{
      background:linear-gradient(160deg,#F7D8E4,#D97BA2);
    }

    .result-poster.fallback2{
      background:linear-gradient(160deg,#E7C4E0,#B678B0);
    }

    .result-poster.fallback3{
      background:linear-gradient(160deg,#F3E0C7,#D9A25D);
    }

    .result-poster.fallback4{
      background:linear-gradient(160deg,#CDE0D8,#7FA98F);
    }

    .result-poster.fallback5{
      background:linear-gradient(160deg,#F6C9C9,#C97070);
    }

    .result-poster.fallback6{
      background:linear-gradient(160deg,#D8D6F3,#8A85C9);
    }

    .result-score{
      position:absolute;
      left:10px;
      top:10px;
      padding:4px 9px;
      border-radius:999px;
      background:rgba(42,18,32,.62);
      color:#fff;
      font-size:.7rem;
      font-weight:800;
    }

    .result-status{
      position:absolute;
      right:10px;
      top:10px;
      padding:4px 9px;
      border-radius:999px;
      background:#fff;
      color:var(--accent-deep);
      font-size:.63rem;
      font-weight:800;
    }

    .result-body{
      padding:14px 16px 17px;
    }

    .result-body h4{
      margin:0 0 3px;
      font-size:.9rem;
      line-height:1.5;
    }

    .result-body .jp{
      color:var(--ink-faint);
      font-size:.67rem;
      margin-bottom:9px;
    }

    .result-tags{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .result-tags span{
      padding:3px 8px;
      border-radius:999px;
      background:var(--bg-alt);
      color:var(--ink-soft);
      font-size:.63rem;
    }

    .empty{
      padding:45px 20px;
      text-align:center;
      color:var(--ink-faint);
      border:1px dashed var(--accent-line);
      border-radius:16px;
      background:#fff;
      grid-column:1 / -1;
    }

    /* PAGINATION */

    .pagination{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-top:34px;
    }

    .page-btn{
      width:38px;
      height:38px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      border:1px solid var(--accent-line);
      color:var(--ink-soft);
      cursor:pointer;
      user-select:none;
      font-size:.8rem;
    }

    .page-btn.active{
      background:var(--ink);
      color:#fff;
      border-color:var(--ink);
    }

    /* RESPONSIVE */

    @media(max-width:980px){
      .nav-links{
        display:none;
      }

      .layout{
        grid-template-columns:1fr;
      }

      .filters{
        position:static;
      }

      .result-grid{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:600px){
      .wrap{
        padding:0 18px;
      }

      .nav-actions .btn{
        display:none;
      }

      .result-grid{
        grid-template-columns:1fr 1fr;
        gap:12px;
      }

      .result-poster{
        height:180px;
      }

      .results-head{
        align-items:flex-start;
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="wrap nav-inner">

    <a class="logo" href="index.html">
      <span class="mark">MFA</span>
      مای‌فیوریت‌انیمه
    </a>

    <nav class="nav-links">
      <a href="index.html">خانه</a>
      <a href="index.html#airing">در حال پخش</a>
      <a class="active" href="search.html">جستجو</a>
      <a href="index.html#toprated">محبوب‌ترین</a>
      <a href="index.html#newest">جدیدترین</a>
    </nav>

    <div class="nav-actions">
      <a class="icon-btn" href="search.html" title="جستجو">⌕</a>
      <button class="btn btn-primary" id="loginButton">
        ورود / ثبت‌نام
      </button>
    </div>

  </div>
</header>

<section class="search-hero">

  <div class="wrap">

    <h1>جستجو در آرشیو انیمه‌ها</h1>

    <div class="search-box">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="text"
        placeholder="نام انیمه را به فارسی یا انگلیسی بنویس..."
        autocomplete="off"
      >

      <div class="suggest-panel" id="suggestPanel"></div>

    </div>

  </div>

</section>

<div class="wrap">

  <div class="layout">

    <!-- FILTERS -->

    <aside class="filters">

      <h3>فیلترها</h3>

      <div class="filter-group">

        <h4>ژانر</h4>

        <div class="chip-set">

          <span class="chip" data-genre="اکشن">اکشن</span>
          <span class="chip" data-genre="فانتزی">فانتزی</span>
          <span class="chip" data-genre="درام">درام</span>
          <span class="chip" data-genre="رمانتیک">رمانتیک</span>
          <span class="chip" data-genre="کمدی">کمدی</span>
          <span class="chip" data-genre="ورزشی">ورزشی</span>
          <span class="chip" data-genre="علمی‌تخیلی">علمی‌تخیلی</span>
          <span class="chip" data-genre="ماجراجویی">ماجراجویی</span>

        </div>

      </div>

      <div class="filter-group">

        <h4>سال انتشار</h4>

        <div class="range-row">

          <input
            type="range"
            min="1370"
            max="1405"
            value="1370"
            id="yearRange"
          >

          <span class="range-val" id="yearVal">همه</span>

        </div>

      </div>

      <div class="filter-group">

        <h4>حداقل امتیاز</h4>

        <div class="range-row">

          <input
            type="range"
            min="0"
            max="10"
            step="0.5"
            value="0"
            id="scoreRange"
          >

          <span class="range-val" id="scoreVal">همه</span>

        </div>

      </div>

      <div class="filter-group">

        <h4>وضعیت پخش</h4>

        <div class="radio-list">

          <label class="radio-row">
            <input type="radio" name="status" value="" checked>
            همه
          </label>

          <label class="radio-row">
            <input type="radio" name="status" value="در حال پخش">
            در حال پخش
          </label>

          <label class="radio-row">
            <input type="radio" name="status" value="پایان‌یافته">
            پایان‌یافته
          </label>

          <label class="radio-row">
            <input type="radio" name="status" value="اعلام‌شده">
            اعلام‌شده
          </label>

        </div>

      </div>

      <button class="clear-filters" id="clearFilters">
        پاک‌کردن فیلترها
      </button>

    </aside>

    <!-- RESULTS -->

    <main class="results">

      <div class="active-filters" id="activeFilters"></div>

      <div class="results-head">

        <div class="results-count" id="resultsCount">
          در حال بارگذاری...
        </div>

        <div class="sort-select">

          مرتب‌سازی:

          <select id="sortSelect">
            <option value="newest">جدیدترین</option>
            <option value="score">بالاترین امتیاز</option>
            <option value="alpha">الفبایی</option>
          </select>

        </div>

      </div>

      <div class="result-grid" id="resultGrid"></div>

      <div class="pagination" id="pagination"></div>

    </main>

  </div>

</div>

<script>
  const resultGrid = document.getElementById('resultGrid');
  const resultsCount = document.getElementById('resultsCount');
  const searchInput = document.getElementById('searchInput');
  const suggestPanel = document.getElementById('suggestPanel');

  const yearRange = document.getElementById('yearRange');
  const yearVal = document.getElementById('yearVal');

  const scoreRange = document.getElementById('scoreRange');
  const scoreVal = document.getElementById('scoreVal');

  const sortSelect = document.getElementById('sortSelect');
  const clearFilters = document.getElementById('clearFilters');
  const activeFilters = document.getElementById('activeFilters');

  const pagination = document.getElementById('pagination');

  let allResults = [];
  let currentPage = 1;

  const pageSize = 12;

  function faNumber(value){
    return String(value)
      .replace(/0/g,'۰')
      .replace(/1/g,'۱')
      .replace(/2/g,'۲')
      .replace(/3/g,'۳')
      .replace(/4/g,'۴')
      .replace(/5/g,'۵')
      .replace(/6/g,'۶')
      .replace(/7/g,'۷')
      .replace(/8/g,'۸')
      .replace(/9/g,'۹');
  }

  function escapeHtml(value){
    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  function getParams(){
    const params = new URLSearchParams(location.search);

    return {
      q:params.get('q') || '',
      genre:params.get('genre') || '',
      status:params.get('status') || '',
      sort:params.get('sort') || 'newest'
    };
  }

  function applyUrlParams(){
    const params = getParams();

    if(params.q){
      searchInput.value = params.q;
    }

    if(params.genre){
      document
        .querySelectorAll('.chip')
        .forEach(chip=>{
          chip.classList.toggle(
            'on',
            chip.dataset.genre === params.genre
          );
        });
    }

    if(params.status){
      const radio = document.querySelector(
        `input[name="status"][value="${CSS.escape(params.status)}"]`
      );

      if(radio){
        radio.checked = true;
      }
    }

    if(params.sort){
      sortSelect.value = params.sort;
    }
  }

  async function loadResults(){
    resultGrid.innerHTML = `
      <div class="empty">
        در حال دریافت اطلاعات...
      </div>
    `;

    const params = new URLSearchParams();

    const q = searchInput.value.trim();

    if(q){
      params.set('q',q);
    }

    const selectedGenre =
      document.querySelector('.chip.on')?.dataset.genre || '';

    if(selectedGenre){
      params.set('genre',selectedGenre);
    }

    const selectedStatus =
      document.querySelector(
        'input[name="status"]:checked'
      )?.value || '';

    if(selectedStatus){
      params.set('status',selectedStatus);
    }

    const minScore = Number(scoreRange.value);

    if(minScore > 0){
      params.set('minScore',String(minScore));
    }

    params.set('sort',sortSelect.value);

    try{
      const response = await fetch(
        '/api/anime?' + params.toString()
      );

      if(!response.ok){
        throw new Error('API error');
      }

      const data = await response.json();

      allResults = data.data || [];
      currentPage = 1;

      renderResults();
      renderActiveFilters();

    }catch(error){
      console.error(error);

      allResults = [];
      resultsCount.innerHTML = 'خطا در دریافت اطلاعات';
      resultGrid.innerHTML = `
        <div class="empty">
          سرور در دسترس نیست یا هنوز راه‌اندازی نشده است.
        </div>
      `;
      pagination.innerHTML = '';
    }
  }

  function renderResults(){
    resultsCount.innerHTML =
      `<b>${faNumber(allResults.length)}</b> انیمه پیدا شد`;

    const totalPages =
      Math.max(1,Math.ceil(allResults.length / pageSize));

    if(currentPage > totalPages){
      currentPage = totalPages;
    }

    const start =
      (currentPage - 1) * pageSize;

    const items =
      allResults.slice(start,start + pageSize);

    resultGrid.innerHTML = '';

    if(!items.length){
      resultGrid.innerHTML = `
        <div class="empty">
          هیچ انیمه‌ای با این مشخصات پیدا نشد.
        </div>
      `;
      renderPagination(totalPages);
      return;
    }

    items.forEach((anime,index)=>{

      const card = document.createElement('a');

      card.className = 'result-card';

      card.href =
        `anime-detail.html?id=${encodeURIComponent(anime.id)}`;

      const poster =
        document.createElement('div');

      poster.className =
        `result-poster fallback${(index % 6) + 1}`;

      if(anime.poster){
        poster.style.backgroundImage =
          `url("${anime.poster}")`;
      }

      poster.innerHTML = `
        <span class="result-score">
          ★ ${faNumber(Number(anime.score || 0).toFixed(1))}
        </span>

        <span class="result-status">
          ${escapeHtml(anime.status || 'نامشخص')}
        </span>
      `;

      const body =
        document.createElement('div');

      body.className = 'result-body';

      const title =
        document.createElement('h4');

      title.textContent =
        anime.title || 'بدون عنوان';

      const jp =
        document.createElement('div');

      jp.className = 'jp';
      jp.textContent =
        anime.jp_title || '';

      const tags =
        document.createElement('div');

      tags.className = 'result-tags';

      String(anime.genres || '')
        .split(/[،,·]/)
        .map(x=>x.trim())
        .filter(Boolean)
        .slice(0,4)
        .forEach(tag=>{
          const span =
            document.createElement('span');

          span.textContent = tag;
          tags.appendChild(span);
        });

      body.appendChild(title);
      body.appendChild(jp);
      body.appendChild(tags);

      card.appendChild(poster);
      card.appendChild(body);

      resultGrid.appendChild(card);
    });

    renderPagination(totalPages);
  }

  function renderPagination(totalPages){
    pagination.innerHTML = '';

    if(totalPages <= 1){
      return;
    }

    const previous =
      document.createElement('div');

    previous.className = 'page-btn';
    previous.textContent = '‹';

    previous.onclick = ()=>{
      if(currentPage > 1){
        currentPage--;
        renderResults();
        window.scrollTo({
          top:0,
          behavior:'smooth'
        });
      }
    };

    pagination.appendChild(previous);

    for(let page=1;page<=totalPages;page++){

      if(
        totalPages > 6 &&
        page > 3 &&
        page < totalPages - 2 &&
        Math.abs(page - currentPage) > 1
      ){
        if(
          page === 4 ||
          page === totalPages - 3
        ){
          const dots =
            document.createElement('div');

          dots.className = 'page-btn';
          dots.textContent = '…';

          pagination.appendChild(dots);
        }

        continue;
      }

      const btn =
        document.createElement('div');

      btn.className =
        'page-btn' +
        (page === currentPage ? ' active' : '');

      btn.textContent = faNumber(page);

      btn.onclick = ()=>{
        currentPage = page;
        renderResults();

        window.scrollTo({
          top:0,
          behavior:'smooth'
        });
      };

      pagination.appendChild(btn);
    }

    const next =
      document.createElement('div');

    next.className = 'page-btn';
    next.textContent = '›';

    next.onclick = ()=>{
      if(currentPage < totalPages){
        currentPage++;
        renderResults();

        window.scrollTo({
          top:0,
          behavior:'smooth'
        });
      }
    };

    pagination.appendChild(next);
  }

  function renderActiveFilters(){
    activeFilters.innerHTML = '';

    const q =
      searchInput.value.trim();

    const genre =
      document.querySelector('.chip.on')
        ?.dataset.genre || '';

    const status =
      document.querySelector(
        'input[name="status"]:checked'
      )?.value || '';

    const minScore =
      Number(scoreRange.value);

    const items = [];

    if(q){
      items.push({
        label:`جستجو: ${q}`,
        type:'q'
      });
    }

    if(genre){
      items.push({
        label:genre,
        type:'genre'
      });
    }

    if(status){
      items.push({
        label:status,
        type:'status'
      });
    }

    if(minScore > 0){
      items.push({
        label:`امتیاز ${faNumber(minScore.toFixed(1))}+`,
        type:'score'
      });
    }

    items.forEach(item=>{

      const chip =
        document.createElement('span');

      chip.className = 'active-chip';

      chip.innerHTML = `
        ${escapeHtml(item.label)}
        <span class="x">✕</span>
      `;

      chip
        .querySelector('.x')
        .onclick = ()=>{
          removeFilter(item.type);
        };

      activeFilters.appendChild(chip);
    });
  }

  function removeFilter(type){

    if(type === 'q'){
      searchInput.value = '';
    }

    if(type === 'genre'){
      document
        .querySelectorAll('.chip')
        .forEach(chip=>{
          chip.classList.remove('on');
        });
    }

    if(type === 'status'){
      const all =
        document.querySelector(
          'input[name="status"][value=""]'
        );

      if(all){
        all.checked = true;
      }
    }

    if(type === 'score'){
      scoreRange.value = 0;
      scoreVal.textContent = 'همه';
    }

    loadResults();
  }

  /* GENRE CHIPS */

  document
    .querySelectorAll('.chip')
    .forEach(chip=>{

      chip.addEventListener('click',()=>{

        const wasOn =
          chip.classList.contains('on');

        document
          .querySelectorAll('.chip')
          .forEach(other=>{
            other.classList.remove('on');
          });

        if(!wasOn){
          chip.classList.add('on');
        }

        currentPage = 1;
        loadResults();
      });
    });

  /* STATUS */

  document
    .querySelectorAll('input[name="status"]')
    .forEach(radio=>{
      radio.addEventListener(
        'change',
        loadResults
      );
    });

  /* SEARCH */

  let searchTimer;

  searchInput.addEventListener('input',()=>{

    clearTimeout(searchTimer);

    renderSuggestions();

    searchTimer =
      setTimeout(loadResults,250);
  });

  async function renderSuggestions(){

    const q =
      searchInput.value.trim();

    if(!q){
      suggestPanel.classList.remove('show');
      return;
    }

    try{

      const response =
        await fetch(
          '/api/anime?q=' +
          encodeURIComponent(q)
        );

      if(!response.ok){
        throw new Error();
      }

      const data =
        await response.json();

      const matches =
        (data.data || []).slice(0,5);

      if(!matches.length){
        suggestPanel.classList.remove('show');
        return;
      }

      suggestPanel.innerHTML = '';

      matches.forEach(anime=>{

        const row =
          document.createElement('div');

        row.className = 'suggest-row';

        const thumb =
          document.createElement('div');

        thumb.className = 'suggest-thumb';

        if(anime.poster){
          thumb.style.backgroundImage =
            `url("${anime.poster}")`;
        }

        const title =
          document.createElement('div');

        title.className = 'suggest-title';

        title.innerHTML = `
          ${escapeHtml(anime.title || '')}
          <small>
            ${escapeHtml(anime.jp_title || '')}
          </small>
        `;

        row.appendChild(thumb);
        row.appendChild(title);

        row.onclick = ()=>{
          window.location.href =
            `anime-detail.html?id=${encodeURIComponent(anime.id)}`;
        };

        suggestPanel.appendChild(row);
      });

      suggestPanel.classList.add('show');

    }catch{
      suggestPanel.classList.remove('show');
    }
  }

  document.addEventListener('click',(event)=>{
    if(!event.target.closest('.search-box')){
      suggestPanel.classList.remove('show');
    }
  });

  /* YEAR */

  yearRange.addEventListener('input',()=>{

    const value =
      Number(yearRange.value);

    if(value <= 1370){
      yearVal.textContent = 'همه';
    }else{
      yearVal.textContent =
        faNumber(value) + '+';
    }

    /*
      Year filtering needs a backend parameter.
      It is kept ready here for the next server update.
    */
  });

  /* SCORE */

  scoreRange.addEventListener('input',()=>{

    const value =
      Number(scoreRange.value);

    if(value === 0){
      scoreVal.textContent = 'همه';
    }else{
      scoreVal.textContent =
        faNumber(value.toFixed(1));
    }

    loadResults();
  });

  /* SORT */

  sortSelect.addEventListener(
    'change',
    loadResults
  );

  /* CLEAR */

  clearFilters.addEventListener('click',()=>{

    searchInput.value = '';

    document
      .querySelectorAll('.chip')
      .forEach(chip=>{
        chip.classList.remove('on');
      });

    document
      .querySelector(
        'input[name="status"][value=""]'
      ).checked = true;

    yearRange.value = 1370;
    yearVal.textContent = 'همه';

    scoreRange.value = 0;
    scoreVal.textContent = 'همه';

    sortSelect.value = 'newest';

    currentPage = 1;

    loadResults();
  });

  /* LOGIN BUTTON */

  document
    .getElementById('loginButton')
    .addEventListener('click',()=>{

      const token =
        localStorage.getItem('mfa_token');

      if(token){
        localStorage.removeItem('mfa_token');
        alert('از حساب خارج شدی.');
      }else{
        window.location.href = 'index.html';
      }

    });

  /* START */

  applyUrlParams();

  loadResults();
</script>

</body>
</html>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>جستجو | MFA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet"><style>
:root{--bg:#fffbfc;--bg2:#fdf2f7;--card:#fff;--ink:#2a1220;--soft:#7a5a69;--faint:#b98fa3;--a:#e893b3;--deep:#c15c86;--line:#f0d2df;--gold:#c9932f;--shadow:0 18px 40px -22px rgba(193,92,134,.35);--max:1240px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,sans-serif}.wrap{max-width:var(--max);margin:auto;padding:0 28px}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.navbar{position:sticky;top:0;z-index:10;background:rgba(255,251,252,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-weight:800;font-size:1.4rem}.logo b{font-family:Georgia,serif;font-style:italic;color:var(--deep)}.links{display:flex;gap:28px;color:var(--soft);font-size:.9rem}.links a:hover,.links .active{color:var(--deep);font-weight:800}.btn{border:0;border-radius:999px;padding:10px 20px;background:var(--ink);color:#fff;font-weight:700}.hero{background:var(--bg2);border-bottom:1px solid var(--line);padding:42px 0}.hero h1{font-size:1.6rem;margin:0 0 18px}.search{position:relative;max-width:720px}.search input{width:100%;padding:16px 50px 16px 20px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:0}.search .ic{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--faint)}.suggest{display:none;position:absolute;top:58px;right:0;left:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);z-index:5}.suggest.show{display:block}.srow{padding:11px 16px;display:flex;gap:12px;align-items:center}.srow:hover{background:var(--bg2)}.sth{width:38px;height:38px;border-radius:8px}.srow small{display:block;color:var(--faint);font-size:.72rem}.layout{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:34px 0 64px;align-items:start}.filters{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;position:sticky;top:96px}.filters h3{margin:0 0 18px}.fg{margin-bottom:22px}.fg h4{margin:0 0 10px;color:var(--soft);font-size:.77rem}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--soft);font-size:.76rem;cursor:pointer}.chip.on{background:var(--a);border-color:var(--a);color:#fff}.range{display:flex;gap:10px;align-items:center}.range input{flex:1;accent-color:var(--deep)}.range span{min-width:45px;font-size:.78rem;color:var(--soft)}.radio{display:grid;gap:8px;color:var(--soft);font-size:.82rem}.radio label{cursor:pointer}.clear{margin-top:4px;width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--faint);cursor:pointer}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.count{color:var(--soft);font-size:.88rem}.sort{display:flex;gap:8px;align-items:center;color:var(--soft);font-size:.8rem}.sort select{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#fff}.active{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}.tag{background:var(--bg2);border:1px solid var(--line);color:var(--deep);padding:6px 10px;border-radius:999px;font-size:.75rem}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.poster{height:215px;position:relative}.score,.status{position:absolute;top:10px;padding:4px 8px;border-radius:999px;font-size:.67rem;font-weight:800}.score{left:10px;background:rgba(42,18,32,.65);color:#fff}.status{right:10px;background:#fff;color:var(--deep)}.body{padding:13px 14px 16px}.body h4{margin:0 0 4px;font-size:.9rem}.jp{font-size:.68rem;color:var(--faint);margin-bottom:8px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{background:var(--bg2);padding:3px 7px;border-radius:999px;font-size:.64rem;color:var(--soft)}.p1{background:linear-gradient(160deg,#f7d8e4,#d97ba2)}.p2{background:linear-gradient(160deg,#e7c4e0,#b678b0)}.p3{background:linear-gradient(160deg,#f3e0c7,#d9a25d)}.p4{background:linear-gradient(160deg,#cde0d8,#7fa98f)}.p5{background:linear-gradient(160deg,#f6c9c9,#c97070)}.p6{background:linear-gradient(160deg,#d8d6f3,#8a85c9)}.p7{background:linear-gradient(160deg,#fbe3c6,#e0965f)}.p8{background:linear-gradient(160deg,#d6eae6,#6faf9e)}.empty{grid-column:1/-1;padding:50px;text-align:center;color:var(--faint);border:1px dashed var(--line);border-radius:16px;background:var(--bg2)}.pagination{display:flex;justify-content:center;gap:8px;margin-top:28px}.pg{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}.pg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:980px){.links{display:none}.layout{grid-template-columns:1fr}.filters{position:static}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:0 18px}.grid{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header class="navbar"><div class="wrap nav"><a class="logo" href="index.html"><b>MFA</b> مای‌فیوریت‌انیمه</a><nav class="links"><a href="index.html">خانه</a><a href="index.html#airing">در حال پخش</a><a class="active" href="search.html">جستجو</a><a href="index.html#top">محبوب‌ترین</a><a href="index.html#newest">جدیدترین</a></nav><a class="btn" href="admin.html">پنل مدیریت</a></div></header>
<section class="hero"><div class="wrap"><h1>جستجو در آرشیو انیمه‌ها</h1><div class="search"><span class="ic">⌕</span><input id="q" placeholder="نام انیمه را به فارسی یا ژاپنی بنویس..." autocomplete="off"><div class="suggest" id="suggest"></div></div></div></section>
<div class="wrap"><div class="layout"><aside class="filters"><h3>فیلترها</h3><div class="fg"><h4>ژانر</h4><div class="chips" id="genres"><span class="chip on">فانتزی</span><span class="chip">اکشن</span><span class="chip">درام</span><span class="chip">رمانتیک</span><span class="chip">کمدی</span><span class="chip">ورزشی</span><span class="chip">علمی‌تخیلی</span></div></div><div class="fg"><h4>حداقل امتیاز</h4><div class="range"><input type="range" min="0" max="10" step="0.1" value="7" id="minScore"><span id="scoreVal">۷.۰</span></div></div><div class="fg"><h4>وضعیت</h4><div class="radio"><label><input type="radio" name="status" value="all" checked> همه</label><label><input type="radio" name="status" value="در حال پخش"> در حال پخش</label><label><input type="radio" name="status" value="پایان‌یافته"> پایان‌یافته</label><label><input type="radio" name="status" value="اعلام‌شده"> اعلام‌شده</label></div></div><button class="clear" id="clear">پاک‌کردن فیلترها</button></aside>
<main><div class="active" id="active"></div><div class="head"><div class="count" id="count"></div><div class="sort">مرتب‌سازی:<select id="sort"><option value="popular">محبوب‌ترین</option><option value="newest">جدیدترین</option><option value="score">بالاترین امتیاز</option><option value="alpha">الفبایی</option></select></div></div><div class="grid" id="grid"></div><div class="pagination"><span class="pg on">۱</span><span class="pg">۲</span><span class="pg">۳</span></div></main></div></div>
<script>
const base=[{t:'سایه‌های اسپاراد',jp:'スパラードの影',score:9.2,status:'در حال پخش',g:['فانتزی','اکشن']},{t:'خط شکن آسمان',jp:'空の破断線',score:9,status:'در حال پخش',g:['اکشن','فانتزی']},{t:'باغ ون‌یو',jp:'ヴァンユウの庭',score:8.8,status:'پایان‌یافته',g:['درام']},{t:'مریدیان سرخ',jp:'紅の子午線',score:8.7,status:'در حال پخش',g:['علمی‌تخیلی']},{t:'زمزمه‌های کاگه',jp:'影の囁き',score:8.6,status:'در حال پخش',g:['رمزآلود','درام']},{t:'ترانه‌ی موج پنجم',jp:'第五波の歌',score:8.5,status:'پایان‌یافته',g:['موسیقی']},{t:'باشگاه ستاره صبح',jp:'朝星クラブ',score:8.4,status:'در حال پخش',g:['ورزشی']},{t:'دفترچه هزار فصل',jp:'千季ノート',score:8.3,status:'در حال پخش',g:['اسلایس‌آف‌لایف']},{t:'کوره‌راه یشمی',jp:'翡翠の小道',score:8.1,status:'پایان‌یافته',g:['فانتزی','ماجراجویی']},{t:'ساعت شنی هوا',jp:'風の砂時計',score:7.9,status:'اعلام‌شده',g:['علمی‌تخیلی']},{t:'رقص مه صبحگاهی',jp:'朝霧の舞',score:7.8,status:'در حال پخش',g:['رمانتیک','درام']},{t:'نور در آب',jp:'水の中の光',score:7.6,status:'پایان‌یافته',g:['درام']}];
const custom=JSON.parse(localStorage.getItem('mfaAnime')||'[]'); const data=[...custom,...base]; const pals=['p1','p2','p3','p4','p5','p6','p7','p8'];
const q=document.getElementById('q'),grid=document.getElementById('grid'),count=document.getElementById('count'),minScore=document.getElementById('minScore'),sort=document.getElementById('sort'),active=document.getElementById('active'); let selectedGenres=new Set(['فانتزی']);
function fa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function draw(){let out=[...data]; const text=q.value.trim().toLowerCase(); if(text)out=out.filter(x=>(x.t+x.jp+x.g.join(' ')).toLowerCase().includes(text)); const st=document.querySelector('input[name=status]:checked').value; if(st!=='all')out=out.filter(x=>x.status===st); if(selectedGenres.size)out=out.filter(x=>[...selectedGenres].some(g=>x.g.includes(g))); out=out.filter(x=>x.score>=+minScore.value); if(sort.value==='score'||sort.value==='popular')out.sort((a,b)=>b.score-a.score); else if(sort.value==='alpha')out.sort((a,b)=>a.t.localeCompare(b.t,'fa')); else out=[...out].sort((a,b)=>(b.added||0)-(a.added||0)); count.innerHTML=`<b>${fa(out.length)}</b> انیمه پیدا شد`; active.innerHTML=[...selectedGenres].map(g=>`<span class="tag">${g}</span>`).join('')+(+minScore.value>0?`<span class="tag">امتیاز ${fa(minScore.value)}+</span>`:''); grid.innerHTML=out.length?out.map((x,i)=>`<a class="card" href="search.html?q=${encodeURIComponent(x.t)}"><div class="poster ${pals[i%pals.length]}"><span class="score">★ ${x.score}</span><span class="status">${x.status}</span></div><div class="body"><h4>${x.t}</h4><div class="jp">${x.jp}</div><div class="tags">${x.g.map(g=>`<span>${g}</span>`).join('')}</div></div></a>`).join(''):`<div class="empty">نتیجه‌ای با این فیلترها پیدا نشد.</div>`}
q.addEventListener('input',()=>{draw(); const text=q.value.trim(); const s=document.getElementById('suggest'); if(!text){s.classList.remove('show');return} const m=data.filter(x=>x.t.includes(text)||x.jp.includes(text)).slice(0,5); if(!m.length){s.classList.remove('show');return} s.innerHTML=m.map((x,i)=>`<div class="srow" data-q="${x.t}"><span class="sth ${pals[i%pals.length]}"></span><div>${x.t}<small>${x.jp}</small></div></div>`).join('');s.classList.add('show');s.querySelectorAll('.srow').forEach(r=>r.onclick=()=>{q.value=r.dataset.q;s.classList.remove('show');draw()})}); document.addEventListener('click',e=>{if(!e.target.closest('.search'))document.getElementById('suggest').classList.remove('show')}); document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const g=c.textContent.trim(); c.classList.toggle('on'); c.classList.contains('on')?selectedGenres.add(g):selectedGenres.delete(g);draw()}); minScore.oninput=()=>{document.getElementById('scoreVal').textContent=fa(+minScore.value.toFixed(1));draw()}; document.querySelectorAll('input[name=status]').forEach(r=>r.onchange=draw); sort.onchange=draw; document.getElementById('clear').onclick=()=>{selectedGenres.clear();document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));minScore.value=0;document.getElementById('scoreVal').textContent='۰';document.querySelector('input[value="all"]').checked=true;q.value='';sort.value='popular';draw()}; const params=new URLSearchParams(location.search); if(params.get('q'))q.value=params.get('q'); if(params.get('genre')){selectedGenres.clear();document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); const wanted=params.get('genre');document.querySelectorAll('.chip').forEach(c=>{if(c.textContent.trim()===wanted){c.classList.add('on');selectedGenres.add(wanted)}})} if(params.get('status')==='airing')document.querySelector('input[value="در حال پخش"]').checked=true; if(params.get('sort'))sort.value=params.get('sort'); draw();
</script></body></html>
